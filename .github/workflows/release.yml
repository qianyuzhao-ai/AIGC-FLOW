name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      source_ref:
        description: "待构建的标签或提交；留空使用运行工作流的分支"
        required: false
        type: string

jobs:
  build:
    strategy:
      # 一边挂了另一边继续，别让 mac 的问题连带毙掉 win 的产物
      fail-fast: false
      matrix:
        include:
          # macos runner 现在是 arm64，但 x64 的 Electron 二进制只是下载，不需要 x64 机器。
          # 刻意不打 universal：pnpm workspace 下合并有静默失败的 issue #9366
          - os: macos-latest
            args: --mac --arm64 --x64
          - os: windows-latest
            args: --win
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.ref }}

      # pnpm 必须在 setup-node 之前：setup-node 的 cache: pnpm 要求 pnpm 已就位
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # 静态导出前端（DESKTOP=1 才开 output: export）+ bundle 主进程
      # 由 env 设置 DESKTOP，避免包脚本里的 POSIX 赋值语法在 Windows cmd 下失败。
      - run: pnpm --filter @aigc-flow/client run build
        env:
          DESKTOP: "1"
      - run: pnpm --filter @aigc-flow/desktop run build

      - name: Package
        working-directory: apps/desktop
        run: pnpm exec electron-builder ${{ matrix.args }} --publish never
        env:
          # 没有证书：关掉钥匙串里的证书自动发现，mac 侧走配置里的 ad-hoc（identity: "-"）
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Verify packaged runtime
        run: pnpm --filter @aigc-flow/desktop run test:package

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release/*.exe
          if-no-files-found: error
