appId: com.aigcflow.desktop
productName: AIGC-FLOW
directories:
  output: release
  buildResources: build

# better-sqlite3 13 是 N-API + 自带全平台 prebuild，任何 rebuild 都是浪费，
# 且在 mac 上打 win 包时必然失败
npmRebuild: false

asar: true
# .node 不能从 asar 里 require；而且 binding.js 还要 fs.existsSync 探这个文件，
# 所以整个模块目录一起 unpack，别只 unpack *.node
asarUnpack:
  - "**/node_modules/better-sqlite3/**"

beforePack: build/require-notarization.cjs
afterPack: build/prune-prebuilds.cjs

publish:
  provider: github
  owner: qianyuzhao-ai
  repo: AIGC-FLOW
  releaseType: draft
electronUpdaterCompatibility: ">=2.16"

files:
  - "dist/**/*.cjs"
  - "!dist/tests/**"
  - "package.json"
  # 8 个平台的 prebuild 都先带上，多余的那 7 个由 afterPack 按真实目标平台删掉。
  # 别想在这里用 ${platform} 宏裁 —— 它给的是构建主机的平台，会往 win 包里塞 darwin 的 .node。
  - "node_modules/better-sqlite3/**"

extraResources:
  # from 相对 app 目录（apps/desktop），写成相对仓库根会静默拷不到
  # 迁移 SQL 必须是原样文件：drizzle 要 meta/_journal.json，并对 .sql 原文取 sha256 当幂等键
  - from: ../server/drizzle
    to: drizzle
  - from: ../client/out
    to: web

mac:
  category: public.app-category.graphics-design
  # arm64 / x64 分开出，刻意不打 universal：pnpm workspace 下 universal 合并有静默失败的
  # issue #9366，而且 universal 要同时留两个 arch 的 prebuild，和上面按 arch 裁剪的规则冲突
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  type: distribution
  forceCodeSigning: true
  notarize: true

win:
  target:
    - target: nsis
      arch: [x64]

nsis:
  artifactName: "AIGC-FLOW.Setup.${version}.${ext}"
  # 给安装向导，别用一键静默安装
  oneClick: false
  # 装到当前用户目录，免 UAC 提权，内部分发更顺
  perMachine: false
  allowToChangeInstallationDirectory: true
  # 卸载不删 userData：项目库在里面，误删了没法恢复
  deleteAppDataOnUninstall: false
